# nginx INTERN del contenidor (no confondre amb el vhost de Mailcow).
#
# Astro genera amb format `directory`: /n/el-meu-article/index.html. Els
# assets compilats van a /_astro/ amb hash al nom, així que es poden cachejar
# per sempre; l'HTML no en porta i s'ha de revalidar sempre.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  # Assets compilats per Astro: el nom porta hash del contingut → immutables
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fonts: no canvien mai → un any, immutable
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imatges: canvien molt rarament → 30 dies
  location /img/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # El feed es revalida: si no, un lector podria quedar-se amb un post de
  # retard fins que caduqui la cache.
  location = /rss.xml {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # El full d'estil del feed. `.xsl` no és al mime.types d'nginx, així que
  # sortia com a application/octet-stream i el navegador es negava a
  # aplicar-lo — el feed es tornava a veure en cru. `default_type` sí que
  # s'aplica aquí precisament perquè l'extensió no és al mapa.
  location = /rss.xsl {
    default_type text/xsl;
    add_header Cache-Control "public, max-age=604800";
  }

  # L'HTML sempre revalidat (el text d'un número es pot corregir sense
  # canviar-ne la URL)
  location / {
    add_header Cache-Control "no-cache";
    # `=404` i no `/404.html`: amb el fallback directe la pàgina d'error es
    # serviria amb estat 200, i un cercador indexaria totes les URL mortes
    # com si fossin bones. Amb =404 salta l'error_page de sota, que sí que
    # respon 404.
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;
}
