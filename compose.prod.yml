# Compose de producció — mateix patró que el portfolio.
#
# - `name:` fixa el project name. Sense aquesta línia Compose el dedueix del
#   nom del directori, i si la carpeta es mou un `up` crea contenidors
#   duplicats deixant orfes els que estaven servint.
# - Sense ports al host: el trànsit entra per Caddy, que resol `blog` per
#   DNS intern de Docker a la xarxa `web`.
# - Després de `git pull`: docker compose -f compose.prod.yml up -d --build

name: blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog:latest
    container_name: blog
    restart: unless-stopped
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.orbitaquality.site=blog"

networks:
  web:
    external: true
    name: web
