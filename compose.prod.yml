# Compose de producció — patró estàndard del VPS (vegeu ~/webs/_template).
#
# - `name:` fixa el project name. Sense aquesta línia Compose el dedueix del
#   nom del directori, i si la carpeta es mou un `up` crea contenidors
#   duplicats deixant orfes els que estaven servint.
# - Sense ports al host: el trànsit entra pel nginx de Mailcow, que resol
#   `blog` per DNS intern de Docker a la xarxa compartida.
# - Després de `git pull`: docker compose -f compose.prod.yml up -d --build

name: blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog:latest
    container_name: blog
    restart: unless-stopped
    networks: [mailcow_proxy]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.orbitaquality.site=blog"

networks:
  mailcow_proxy:
    external: true
    name: mailcowdockerized_mailcow-network
